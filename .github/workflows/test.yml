name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install shapely
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Database rules (row-level security) on the runner's Postgres
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres env PGHOST=/var/run/postgresql sh supabase/tests/run.sh
