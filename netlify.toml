# Static site: npm run build writes dist/ (index.html, boxespy.zip, artifact.html).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Accounts: set SUPABASE_URL and SUPABASE_ANON_KEY in Netlify's environment variables (see docs/accounts.md).

[[headers]]
  for = "/boxespy.zip"
  [headers.values]
    Cache-Control = "public, max-age=86400"
